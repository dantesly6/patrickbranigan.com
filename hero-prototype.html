<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hero prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bayon&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1a1713;
    --text: #ece8e1;
    --text-mid: #a09a90;
    --text-dim: #5a5650;
    --green: #4ade80;
    --green-glow: rgba(74, 222, 128, 0.2);
    --mono: 'JetBrains Mono', 'SF Mono', ui-monospace, monospace;
    --display: 'Bayon', sans-serif;
  }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: var(--mono);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  canvas {
    display: block;
    width: 100vw; height: 100vh;
    cursor: pointer;
    touch-action: manipulation;
  }
  #reload-hint {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
    color: var(--text-dim); font-family: var(--mono); font-size: 11px;
    pointer-events: none; opacity: 0;
    transition: opacity 600ms ease 400ms;
  }
  #reload-hint.show { opacity: 1; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="reload-hint">refresh to play again</div>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const reloadHint = document.getElementById('reload-hint');

  const C = {
    bg:        '#1a1713',
    boundary:  '#2d2821',
    obstacle:  '#5a5650',
    text:      '#ece8e1',
    textDim:   '#5a5650',
    textMid:   '#a09a90',
    green:     '#4ade80',
    greenGlow: 'rgba(74, 222, 128, 0.35)',
  };

  const PHYS = {
    gravity: 1500,
    impulse: -450,
    baseScroll: 200,
    spacing: 280,
    baseGap: 180,
    margin: 90,
    birdR: 9,
    obstacleStroke: 1.5,
    boundaryStroke: 1,
  };

  function currentScroll() { return PHYS.baseScroll + Math.min(game.score * 4, 130); }
  function currentGap()    { return Math.max(132, PHYS.baseGap - Math.max(0, game.score - 4) * 2.4); }

  let W = 0, H = 0, dpr = 1;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width  = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  const game = {
    state: 'idle',
    bird: { y: 0, vy: 0 },
    worldOffset: 0,
    obstacles: [],
    score: 0,
    deathTime: 0,
    deathX: 0, deathY: 0,
    audioCtx: null,
  };

  // Tighter death sequence: no zoom-out, no path reveal. Death → expand → hero.
  const PH = {
    hold:      { s: 0,    e: 110  },
    expand:    { s: 110,  e: 760  },
    greenHold: { s: 760,  e: 900  },
    textIn:    { s: 900,  e: 1200 },
    textHold:  { s: 1200, e: 1650 },
    wipe:      { s: 1650, e: 2100 },
    done:      { s: 2100 },
  };
  function phaseT(name, t) {
    const p = PH[name];
    if (t < p.s) return 0;
    if (p.e === undefined) return t >= p.s ? 1 : 0;
    if (t >= p.e) return 1;
    return (t - p.s) / (p.e - p.s);
  }
  const easeOut = t => 1 - Math.pow(1 - t, 3);
  const easeInOut = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

  function ensureAudio() {
    if (game.audioCtx) return;
    try { game.audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  }
  function playNote(freq, dur = 0.18, vol = 0.07) {
    if (!game.audioCtx) return;
    const ac = game.audioCtx;
    const t = ac.currentTime;
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(vol, t + 0.008);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(ac.destination);
    osc.start(t);
    osc.stop(t + dur + 0.05);
  }
  const PENTATONIC = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33];

  function makeObstacle(worldX) {
    const gapSize = currentGap();
    const minY = PHYS.margin;
    const maxY = H - PHYS.margin - gapSize;
    return { worldX, gapY: minY + Math.random() * Math.max(maxY - minY, 0), gapSize, passed: false };
  }

  function reset() {
    game.state = 'idle';
    game.bird = { y: H / 2, vy: 0 };
    game.worldOffset = 0;
    game.obstacles = [];
    game.score = 0;
    game.deathTime = 0;
    let x = W * 0.7;
    while (x < W * 2.4) { game.obstacles.push(makeObstacle(x)); x += PHYS.spacing; }
  }

  function birdScreenX() { return W * 0.30; }
  function birdWorldX()  { return birdScreenX() + game.worldOffset; }

  function flap() {
    if (game.state !== 'playing') return;
    game.bird.vy = PHYS.impulse;
    ensureAudio();
    const yRatio = 1 - Math.max(0, Math.min(1, game.bird.y / H));
    const idx = Math.min(PENTATONIC.length - 1, Math.floor(yRatio * PENTATONIC.length));
    playNote(PENTATONIC[idx]);
  }

  function startGame() { game.state = 'playing'; }

  function onTap() {
    ensureAudio();
    if (game.audioCtx && game.audioCtx.state === 'suspended') game.audioCtx.resume();
    if (game.state === 'idle') { startGame(); flap(); }
    else if (game.state === 'playing') { flap(); }
  }

  function die() {
    game.state = 'dying';
    game.deathTime = performance.now();
    game.deathX = birdScreenX();
    game.deathY = game.bird.y;
  }

  function update(dt, now) {
    if (game.state === 'playing') {
      game.bird.vy += PHYS.gravity * dt;
      game.bird.y  += game.bird.vy * dt;
      game.worldOffset += currentScroll() * dt;

      if (game.bird.y < 10) { game.bird.y = 10; game.bird.vy = 0; }
      if (game.bird.y > H - 10) { game.bird.y = H - 10; die(); return; }

      const last = game.obstacles[game.obstacles.length - 1];
      if (last && (last.worldX - game.worldOffset) < W + PHYS.spacing * 2) {
        game.obstacles.push(makeObstacle(last.worldX + PHYS.spacing));
      }
      // Prune obstacles that have scrolled off
      while (game.obstacles.length && game.obstacles[0].worldX - game.worldOffset < -20) {
        game.obstacles.shift();
      }

      const bwx = birdWorldX();
      for (const o of game.obstacles) {
        if (!o.passed && o.worldX < bwx - 4) { o.passed = true; game.score++; }
      }
      for (const o of game.obstacles) {
        const dx = Math.abs(o.worldX - bwx);
        if (dx < PHYS.birdR + 2) {
          if (game.bird.y - PHYS.birdR < o.gapY ||
              game.bird.y + PHYS.birdR > o.gapY + o.gapSize) {
            die(); return;
          }
        }
      }
    }

    if (game.state === 'dying') {
      const t = now - game.deathTime;
      if (t >= PH.done.s && !reloadHint.classList.contains('show')) {
        reloadHint.classList.add('show');
      }
    }
  }

  function drawDot(x, y, r, glow = true) {
    if (glow) { ctx.shadowColor = C.greenGlow; ctx.shadowBlur = 14; }
    ctx.fillStyle = C.green;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
    if (glow) ctx.shadowBlur = 0;
  }

  function heroFontSize() { return Math.max(72, Math.min(176, W * 0.18)); }
  function heroPadding()  { return Math.max(24, Math.min(48, W * 0.05)); }

  function drawHeroBlock(textColor, alpha) {
    if (alpha <= 0.001) return;
    const fs = heroFontSize();
    const lh = fs * 0.9;
    const pad = heroPadding();
    ctx.save();
    ctx.globalAlpha = alpha;

    // Hero text
    ctx.font = `400 ${fs}px Bayon, system-ui, sans-serif`;
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    ctx.fillStyle = textColor;
    const totalH = lh * 2;
    const firstBaseline = H / 2 - totalH / 2 + fs * 0.85;
    ctx.fillText('PATRICK', pad, firstBaseline);
    ctx.fillText('BRANIGAN', pad, firstBaseline + lh);

    // Score badge below the hero text
    const captionY = firstBaseline + lh + fs * 0.35;
    ctx.font = `500 12px JetBrains Mono, ui-monospace, monospace`;
    ctx.textBaseline = 'top';
    ctx.fillText(`FLIGHT — ${String(game.score).padStart(3, '0')}`, pad + 4, captionY);

    ctx.restore();
  }

  function hexToRgb(h) {
    h = h.replace('#','');
    return [parseInt(h.substr(0,2),16), parseInt(h.substr(2,2),16), parseInt(h.substr(4,2),16)];
  }
  function lerpColor(a, b, t) {
    const A = hexToRgb(a), B = hexToRgb(b);
    return `rgb(${Math.round(A[0]+(B[0]-A[0])*t)}, ${Math.round(A[1]+(B[1]-A[1])*t)}, ${Math.round(A[2]+(B[2]-A[2])*t)})`;
  }

  function render() {
    const now = performance.now();
    const deathT = game.state === 'dying' ? (now - game.deathTime) : 0;

    // Default bg
    ctx.fillStyle = C.bg;
    ctx.fillRect(0, 0, W, H);

    const showWorld =
      game.state === 'idle' ||
      game.state === 'playing' ||
      (game.state === 'dying' && deathT < PH.greenHold.s);

    if (showWorld) {
      // Boundaries
      ctx.strokeStyle = C.boundary;
      ctx.lineWidth = PHYS.boundaryStroke;
      ctx.beginPath();
      ctx.moveTo(-W * 5, 10);  ctx.lineTo(W * 5, 10);
      ctx.moveTo(-W * 5, H-10); ctx.lineTo(W * 5, H-10);
      ctx.stroke();

      // Obstacles
      ctx.strokeStyle = C.obstacle;
      ctx.lineWidth = PHYS.obstacleStroke;
      for (const o of game.obstacles) {
        const sx = o.worldX - game.worldOffset;
        ctx.beginPath();
        ctx.moveTo(sx, 10);
        ctx.lineTo(sx, o.gapY);
        ctx.moveTo(sx, o.gapY + o.gapSize);
        ctx.lineTo(sx, H - 10);
        ctx.stroke();
      }

      // Bird — show during idle/playing, and during the hold beat after death
      const birdVisible =
        game.state === 'idle' ||
        game.state === 'playing' ||
        (game.state === 'dying' && deathT < PH.expand.s);
      if (birdVisible) {
        drawDot(birdScreenX(), game.bird.y, PHYS.birdR);
      }
    }

    // Expansion: green disk grows from death point
    if (game.state === 'dying' && deathT >= PH.expand.s && deathT < PH.greenHold.s) {
      const t = easeInOut(phaseT('expand', deathT));
      const corners = [
        Math.hypot(game.deathX, game.deathY),
        Math.hypot(W - game.deathX, game.deathY),
        Math.hypot(game.deathX, H - game.deathY),
        Math.hypot(W - game.deathX, H - game.deathY),
      ];
      const maxR = Math.max(...corners) * 1.05;
      const r = PHYS.birdR + (maxR - PHYS.birdR) * t;
      ctx.shadowColor = C.greenGlow;
      ctx.shadowBlur = 24;
      ctx.fillStyle = C.green;
      ctx.beginPath();
      ctx.arc(game.deathX, game.deathY, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    // Solid color phase: greenHold → textIn → textHold → wipe → done
    if (game.state === 'dying' && deathT >= PH.greenHold.s) {
      const wT = phaseT('wipe', deathT);
      const wipeEase = easeInOut(wT);
      const bg = wT > 0 ? lerpColor(C.green, C.bg, wipeEase) : C.green;
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, W, H);

      const tInEase = easeOut(phaseT('textIn', deathT));
      const textColor = wT > 0
        ? lerpColor(C.bg, C.text, wipeEase)
        : C.bg;
      drawHeroBlock(textColor, tInEase);
    }

    // Score (corner) during play and idle
    if (game.state === 'idle' || game.state === 'playing' ||
        (game.state === 'dying' && deathT < PH.expand.s)) {
      ctx.fillStyle = C.textMid;
      ctx.font = '12px JetBrains Mono, ui-monospace, monospace';
      ctx.textAlign = 'right';
      ctx.textBaseline = 'top';
      ctx.fillText(String(game.score).padStart(3, '0'), W - 28, 24);
    }

    if (game.state === 'idle') {
      ctx.fillStyle = C.textDim;
      ctx.font = '11px JetBrains Mono, ui-monospace, monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'alphabetic';
      ctx.fillText('tap or press space', W / 2, H - 36);
    }
  }

  let lastTime = performance.now();
  function tick(now) {
    const dt = Math.min((now - lastTime) / 1000, 1 / 30);
    lastTime = now;
    update(dt, now);
    render();
    requestAnimationFrame(tick);
  }

  canvas.addEventListener('pointerdown', e => { e.preventDefault(); onTap(); });
  window.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); onTap(); }
  });
  window.addEventListener('resize', () => {
    const prev = game.state;
    resize();
    if (prev === 'idle') reset();
  });

  if (document.fonts && document.fonts.load) {
    document.fonts.load('400 100px Bayon').catch(() => {});
  }

  resize();
  reset();
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
